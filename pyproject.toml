[project]
name = "api-monitor"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator==2.3.0",
    "fastapi==0.115.6",
    "httpx==0.27.2",
    "pydantic-settings==2.14.2",
    "pydantic==2.13.4",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "slowapi==0.1.9",
    "supabase==2.11.0",
    "tenacity==9.0.0",
    "uvicorn[standard]==0.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests with mocked dependencies",
    "integration: Integration tests hitting the FastAPI app",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
